services:
  - type: web
    name: taskflow-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --no-input && python manage.py collectstatic --no-input
    startCommand: gunicorn project_task.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: 'False'
      - key: DJANGO_ALLOWED_HOSTS
        value: taskflow-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-taskflow.vercel.app
